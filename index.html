<!DOCTYPE html>
<html lang="es">
<head>

<title>Rober The Barber</title>

<style>
body {

  font-family: 'Arial', sans-serif;
  background: #0b0b0b;

/* HEADER */
header {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;

h1 {

  margin: 0;
}

p {
  color: #ccc;
}

.btn {

  color: black;

/* SECCIONES */

.card {

  padding: 20px;
  border-radius: 12px;
}

/* FOOTER */
footer {
  padding: 20px;
  text-align: center;
  background: #000;
  color: #888;
}

  </div>
</section>

<section>
  <h2>Sobre mí</h2>
  <p>Barbero profesional especializado en estilos modernos y clásicos. Atención personalizada y calidad premium.</p>
</section>
